[project]
name = "lumii-mastery"
version = "0.1.0"
description = "Reproducible knowledge-tracing training and evaluation for LUMII"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kaggle>=2.0.0",
  "matplotlib>=3.10.0",
  "numpy>=2.2.0",
  "onnx>=1.17.0",
  "onnxruntime>=1.20.0",
  "onnxscript>=0.2.0",
  "optuna>=4.2.0",
  "pandas>=2.2.0",
  "polars>=1.22.0",
  "pyarrow>=19.0.0",
  "pybkt>=1.4.1",
  "pykt-toolkit>=0.0.38",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.6.0",
  "scipy>=1.15.0",
  "torch>=2.6.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.9.0"]

[project.scripts]
lumii-prepare = "lumii_mastery.data.prepare:main"
lumii-train = "lumii_mastery.training:main"
lumii-train-transfer = "lumii_mastery.training_transfer:main"
lumii-benchmark-pykt = "lumii_mastery.benchmark_pykt:main"
lumii-tune-transfer = "lumii_mastery.tuning:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumii_mastery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
